name: PYTCH Content Radar

on:
  schedule:
    # Every day, twice: ~12:52am and ~09:52am Singapore time (= 16:52 and 01:52 UTC).
    # Off round numbers on purpose: GitHub Actions scheduled runs queue worst
    # at the top of the hour, which was causing multi-hour send delays.
    - cron: '52 16 * * *'
    - cron: '52 1 * * *'
  workflow_dispatch:

jobs:
  content-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run internal PYTCH content radar
        env:
          BOT_MODE: internal
          TELEGRAM_BOT_TOKEN: ${{ secrets.INTERNAL_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.INTERNAL_TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.INTERNAL_TELEGRAM_MESSAGE_THREAD_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py
