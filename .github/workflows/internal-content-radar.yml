name: PYTCH Content Radar

on:
  schedule:
    # Monday-Friday, 09:30 Singapore time = 01:30 UTC
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

jobs:
  content-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run internal PYTCH content radar
        env:
          BOT_MODE: internal
          TELEGRAM_BOT_TOKEN: ${{ secrets.INTERNAL_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.INTERNAL_TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.INTERNAL_TELEGRAM_MESSAGE_THREAD_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py
