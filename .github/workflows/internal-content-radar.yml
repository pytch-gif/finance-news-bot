name: PYTCH Content Radar

on:
  workflow_dispatch:  # triggered externally by cron-job.org, not GitHub's schedule: — must fire at/after ~9am SGT so the Friday weekly recap gate (WEEKLY_RECAP_MIN_HOUR) still works

jobs:
  content-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run internal PYTCH content radar
        env:
          BOT_MODE: internal
          TELEGRAM_BOT_TOKEN: ${{ secrets.INTERNAL_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.INTERNAL_TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.INTERNAL_TELEGRAM_MESSAGE_THREAD_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py
