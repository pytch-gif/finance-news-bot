name: MY-SG Daily Brief

on:
  schedule:
    # Every day, twice: ~12:13am and ~09:13am Singapore time (= 16:13 and 01:13 UTC).
    # Off round numbers on purpose: GitHub Actions scheduled runs queue worst
    # at the top of the hour, which was causing multi-hour send delays.
    - cron: '13 16 * * *'
    - cron: '13 1 * * *'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run external MY-SG daily brief
        env:
          BOT_MODE: external
          TELEGRAM_BOT_TOKEN: ${{ secrets.EXTERNAL_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.EXTERNAL_TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py
