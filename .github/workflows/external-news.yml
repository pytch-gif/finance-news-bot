name: MY-SG Daily Brief

on:
  workflow_dispatch:  # triggered externally by cron-job.org, not GitHub's schedule:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run external MY-SG daily brief
        env:
          BOT_MODE: external
          TELEGRAM_BOT_TOKEN: ${{ secrets.EXTERNAL_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.EXTERNAL_TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py
