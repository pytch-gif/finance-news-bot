name: MY-SG Daily Brief

on:
  schedule:
    # Monday-Friday, 09:00 Singapore time = 01:00 UTC
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run external MY-SG daily brief
        env:
          BOT_MODE: external
          TELEGRAM_BOT_TOKEN: ${{ secrets.EXTERNAL_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.EXTERNAL_TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py
